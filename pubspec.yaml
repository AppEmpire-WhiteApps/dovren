name: dovren
description: Dovren — a focused Safari blocker for calmer recipe reading.
publish_to: 'none'
version: 1.0.2+3
environment:
  sdk: ^3.11.5
  flutter: '>=3.41.7'
dependencies:
  clarity_flutter: ^1.10.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.1
  in_app_review: ^2.0.10
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/onboarding/


flutter_launcher_icons:
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon.jpg"